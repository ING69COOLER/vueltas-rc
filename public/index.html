<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablero de Vueltas RC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Saira+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
  /* Tema "pista nocturna" tipo Hot Wheels — azul profundo, llama naranja/rojo,
     amarillo eléctrico y cromado. Un solo mundo visual, comprometido. */
  :root{
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    --track:#081230; --panel:#0d1e45; --panel-2:#112a5e; --line:#1f3f7d;
    --ink:#eaf2ff; --muted:#8ca6d6;
    --flame-y:#ffd400; --flame-o:#ff7a00; --flame-r:#ec1c24;
    --accent:#ff6a00; --accent-ink:#1a0b00; --gold:#ffd400; --good:#28e07f; --danger:#ff5a5a;
    --f-display:"Racing Sans One",system-ui,sans-serif;
    --f-num:"Saira Condensed","Archivo",system-ui,sans-serif;
    --f-ui:"Archivo",system-ui,-apple-system,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font:14px/1.45 var(--f-ui); color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #15336e 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 20%, #2a1250 0%, transparent 55%),
      var(--track);
    min-height:100%;
  }
  img{max-width:100%} [hidden]{display:none!important}

  /* bandera a cuadros */
  .checker{height:12px;width:100%;
    background:
      conic-gradient(#f4f7ff 90deg,#0a0f1c 90deg 180deg,#f4f7ff 180deg 270deg,#0a0f1c 270deg) 0 0/18px 18px;
    opacity:.9}

  .wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 36px}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;
    background:linear-gradient(180deg,var(--track) 70%,rgba(8,18,48,.0));
    padding-block:10px 12px}
  .brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.6rem);
    letter-spacing:.01em;line-height:.95;transform:skewX(-7deg);text-wrap:balance;
    background:linear-gradient(92deg,var(--flame-y),var(--flame-o) 55%,var(--flame-r));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 0 rgba(0,0,0,.25);filter:drop-shadow(0 3px 10px rgba(255,106,0,.35))}
  .spark{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    transform:skewX(-7deg);margin-top:2px}

  .clockwrap{margin-left:auto;text-align:right;min-width:0}
  .clock{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;
    font-size:clamp(2.6rem,13vw,4.6rem);line-height:.9;letter-spacing:.01em;
    color:var(--ink)}
  .clock.run{background:linear-gradient(92deg,var(--flame-y),var(--flame-o) 60%,var(--flame-r));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .clock.low{color:var(--danger);animation:pulse .9s steps(2,end) infinite}
  .clock.done{color:var(--gold)}
  .clocktag{font-family:var(--f-num);font-weight:600;font-size:.8rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  @keyframes pulse{50%{opacity:.35}}

  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  button{font-family:var(--f-ui);font-size:.95rem;font-weight:700;cursor:pointer;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    border-radius:11px;padding:10px 15px;-webkit-tap-highlight-color:transparent;transition:transform .05s}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--flame-o);outline-offset:2px}
  button.flame{border:none;color:var(--accent-ink);
    background:linear-gradient(180deg,var(--flame-y),var(--flame-o) 55%,var(--flame-r));
    box-shadow:0 3px 0 #a81608, 0 6px 16px rgba(255,106,0,.35)}
  button.flame:active{box-shadow:0 1px 0 #a81608}
  button.ghost{background:transparent;color:var(--muted)}
  .bar .spacer{margin-left:auto}

  .timebox{display:flex;gap:6px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:5px 8px}
  .timebox label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  input#mins{width:56px;text-align:center}
  .preset{padding:7px 10px;font-size:.85rem;border-radius:9px}

  input{font-family:var(--f-ui);font-size:.95rem;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
  input::placeholder{color:#6f87b8}

  .meta{color:var(--muted);font-size:.85rem;margin:12px 0 10px;display:flex;gap:16px;flex-wrap:wrap;
    font-family:var(--f-num);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .meta b{color:var(--gold)}

  .finish{display:none;margin:4px 0 14px;text-align:center;font-family:var(--f-display);
    font-size:clamp(1.3rem,5vw,2rem);color:var(--track);padding:12px;border-radius:14px;
    background:linear-gradient(92deg,var(--flame-y),var(--flame-o) 55%,var(--flame-r));
    transform:skewX(-6deg);box-shadow:0 8px 24px rgba(255,106,0,.4)}
  body.over .finish{display:block;animation:pop .4s ease}
  @keyframes pop{from{transform:skewX(-6deg) scale(.9);opacity:.3}}

  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-left:6px solid var(--line);
    border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
  .row::after{content:"";position:absolute;inset:0 0 0 auto;width:120px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,106,0,.07));}
  .row.leader{border-left-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset, 0 6px 20px rgba(255,212,0,.15)}
  .pos{font-family:var(--f-display);font-size:1.5rem;min-width:1.7ch;text-align:center;color:var(--muted);
    transform:skewX(-6deg)}
  .row.leader .pos{color:var(--gold)}
  .who{min-width:0}
  .name{font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .car{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-transform:uppercase;letter-spacing:.08em}
  .laps{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;
    font-size:2.4rem;line-height:1;text-align:right;min-width:2.3ch;color:var(--ink)}
  .ops{display:flex;align-items:center;gap:7px}
  .lapbtn{font-family:var(--f-num);font-weight:700;font-size:1.5rem;line-height:1;
    width:62px;height:56px;border-radius:13px;color:var(--accent-ink);border:none;
    background:linear-gradient(180deg,var(--flame-y),var(--flame-o) 55%,var(--flame-r));
    box-shadow:0 3px 0 #a81608}
  .lapbtn:active{box-shadow:0 1px 0 #a81608}
  .mini{width:40px;height:40px;padding:0;color:var(--muted);font-size:1.3rem;border-radius:10px;background:var(--panel)}
  .mini.del{color:var(--danger)}

  form{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  input#pname{flex:2 1 170px} input#pcar{flex:1 1 120px}
  form button{flex:0 0 auto}

  .empty{text-align:center;color:var(--muted);padding:44px 16px;border:1px dashed var(--line);
    border-radius:14px;font-family:var(--f-num);letter-spacing:.06em;text-transform:uppercase}
  .toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:var(--ink);color:var(--track);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:700;
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:.96}

  /* Modo pantalla / proyección — se ocultan los controles pero NO el botón para salir */
  body.tv form,body.tv .ops,body.tv .meta .hint,
  body.tv .timebox,body.tv #start,body.tv #pause,body.tv #reset{display:none}
  body.tv .bar{margin-top:0}
  body.tv #tv{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
  body.tv .clock{font-size:clamp(3rem,16vw,6rem)}
  body.tv .row{grid-template-columns:auto 1fr auto;padding:18px 20px}
  body.tv .pos{font-size:2rem}
  body.tv .name{font-size:1.7rem}
  body.tv .car{font-size:1rem}
  body.tv .laps{font-size:3.4rem}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="checker"></div>
<div class="wrap">
  <header>
    <div class="brandrow">
      <div>
        <h1>VUELTAS RC</h1>
        <div class="spark">🔥 Control remoto · carrera en vivo</div>
      </div>
      <div class="clockwrap">
        <div id="clocktag" class="clocktag">Cronómetro</div>
        <div id="clock" class="clock">00:00</div>
      </div>
    </div>

    <div class="bar">
      <div class="timebox">
        <label for="mins">Min</label>
        <input id="mins" type="number" min="0" max="180" inputmode="numeric" placeholder="8">
        <button id="setDur" class="preset">Fijar</button>
        <button class="preset ghost" data-min="3">3</button>
        <button class="preset ghost" data-min="5">5</button>
        <button class="preset ghost" data-min="8">8</button>
      </div>
      <button id="start" class="flame">▶ Iniciar</button>
      <button id="pause">⏸ Pausar</button>
      <button id="reset" class="ghost">↺ Reiniciar</button>
      <button id="tv" class="ghost spacer">Modo pantalla</button>
    </div>
  </header>

  <div class="meta">
    <span id="count">—</span>
    <span id="leaderLabel"></span>
    <span class="hint" id="status"></span>
  </div>

  <div id="finish" class="finish">🏁 ¡TIEMPO! 🏁</div>

  <ul id="list"></ul>

  <form id="addForm" autocomplete="off">
    <input id="pname" placeholder="Nombre del participante" maxlength="40" required>
    <input id="pcar" placeholder="Carro / número" maxlength="30">
    <button type="submit" class="flame">＋ Añadir</button>
  </form>
</div>
<div id="toast" class="toast"></div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const listEl=$("#list"),clockEl=$("#clock"),tagEl=$("#clocktag"),countEl=$("#count"),
        leaderEl=$("#leaderLabel"),statusEl=$("#status"),toastEl=$("#toast");

  let participants=[],timer={running:false,startMs:0,accumMs:0,durationMs:0},offset=0,ready=false,autoPaused=false,wasOver=false;

  // Sonido de meta — Web Audio, sin archivos. Se desbloquea con el primer gesto.
  let ac=null;
  function unlock(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){}}
  ["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,unlock));
  function finishSound(){
    if(!ac)return;
    const t0=ac.currentTime;
    [[880,0,.14],[880,.2,.14],[880,.4,.14],[1319,.62,.6]].forEach(([f,off,dur])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type="square";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0+off);
      g.gain.exponentialRampToValueAtTime(.3,t0+off+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t0+off+dur);
      o.connect(g).connect(ac.destination);o.start(t0+off);o.stop(t0+off+dur+.03);
    });
  }
  let tv=false; try{tv=localStorage.getItem("vueltas-tv")==="1";}catch(e){}
  document.body.classList.toggle("tv",tv);
  $("#tv").textContent=tv?"Salir de pantalla":"Modo pantalla";

  function toast(m){toastEl.textContent=m;toastEl.classList.add("show");
    clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove("show"),2200);}
  function serverNow(){return Date.now()+offset;}
  function elapsed(){return (timer.accumMs||0)+(timer.running?serverNow()-(timer.startMs||0):0);}
  function remaining(){return timer.durationMs>0?Math.max(0,timer.durationMs-elapsed()):null;}
  function fmt(ms){const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),
    m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,"0");
    return h>0?h+":"+p(m)+":"+p(ss):p(m)+":"+p(ss);}

  function renderClock(){
    const rem=remaining(), countdown=rem!==null;
    clockEl.textContent=fmt(countdown?rem:elapsed());
    tagEl.textContent=countdown?(timer.running?"Cuenta regresiva":"Listo · regresiva"):(timer.running?"En marcha":"Cronómetro");
    const over=countdown&&rem<=0&&timer.durationMs>0;
    const low=countdown&&timer.running&&rem>0&&rem<=30000;
    clockEl.classList.toggle("run",timer.running&&!over);
    clockEl.classList.toggle("low",low);
    clockEl.classList.toggle("done",over);
    document.body.classList.toggle("over",over);
    if(over&&!wasOver)finishSound();
    wasOver=over;
    if(over&&timer.running&&!autoPaused){autoPaused=true;post("/api/timer",{action:"pause"});}
    if(!over)autoPaused=false;
  }
  setInterval(renderClock,250);renderClock();

  function sorted(){return participants.slice().sort((a,b)=>(b.laps||0)-(a.laps||0)||(a.createdAt||0)-(b.createdAt||0));}
  function render(){
    const items=sorted();
    countEl.textContent=items.length+(items.length===1?" piloto":" pilotos");
    const lead=items[0];
    leaderEl.innerHTML=(lead&&(lead.laps||0)>0)?"Líder: <b>"+esc(lead.name||"—")+"</b> ("+lead.laps+")":"";
    if(!ready){listEl.innerHTML='<li class="empty">Conectando con la pista…</li>';return;}
    if(!items.length){listEl.innerHTML='<li class="empty">'+
      (tv?"Esperando pilotos…":"Aún no hay pilotos. Añade el primero abajo.")+'</li>';return;}
    listEl.innerHTML=items.map((p,i)=>{
      const leader=i===0&&(p.laps||0)>0;
      return '<li class="row'+(leader?" leader":"")+'">'
        +'<div class="pos">'+(i+1)+'</div>'
        +'<div class="who"><div class="name"></div><div class="car"></div></div>'
        +'<div class="laps">'+(p.laps||0)+'</div>'
        +'<div class="ops">'
        +'<button class="mini" data-act="dec" data-id="'+p.id+'" aria-label="Restar vuelta">−</button>'
        +'<button class="lapbtn" data-act="inc" data-id="'+p.id+'" aria-label="Sumar vuelta">+1</button>'
        +'<button class="mini del" data-act="del" data-id="'+p.id+'" aria-label="Eliminar">×</button>'
        +'</div></li>';
    }).join("");
    items.forEach((p,i)=>{const r=listEl.children[i];
      r.querySelector(".name").textContent=p.name||"Sin nombre";
      r.querySelector(".car").textContent=p.car||"";});
  }
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  async function post(url,data){
    try{await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data||{})});}
    catch(e){toast("Sin conexión con el servidor");}
  }
  listEl.addEventListener("click",e=>{
    const b=e.target.closest("button[data-act]");if(!b)return;
    const id=Number(b.dataset.id);
    if(b.dataset.act==="inc")post("/api/lap",{id,delta:1});
    else if(b.dataset.act==="dec")post("/api/lap",{id,delta:-1});
    else if(b.dataset.act==="del")post("/api/delete",{id});
  });
  $("#addForm").addEventListener("submit",e=>{
    e.preventDefault();const name=$("#pname").value.trim();if(!name)return;
    post("/api/participants",{name,car:$("#pcar").value.trim()});
    $("#pname").value="";$("#pcar").value="";$("#pname").focus();
  });
  $("#start").onclick=()=>post("/api/timer",{action:"start"});
  $("#pause").onclick=()=>post("/api/timer",{action:"pause"});
  $("#reset").onclick=()=>post("/api/timer",{action:"reset"});
  function setDuration(min){post("/api/timer",{action:"duration",minutes:min});}
  $("#setDur").onclick=()=>{const v=parseInt($("#mins").value,10);setDuration(isNaN(v)?0:v);
    toast(v>0?("Carrera armada a "+v+" min"):"Modo cronómetro libre");};
  document.querySelectorAll("button[data-min]").forEach(b=>b.onclick=()=>{
    $("#mins").value=b.dataset.min;setDuration(Number(b.dataset.min));toast("Carrera armada a "+b.dataset.min+" min");});
  $("#tv").onclick=()=>{tv=!tv;document.body.classList.toggle("tv",tv);
    $("#tv").textContent=tv?"Salir de pantalla":"Modo pantalla";
    try{localStorage.setItem("vueltas-tv",tv?"1":"0");}catch(e){}render();};

  function apply(d){
    offset=(d.now||Date.now())-Date.now();
    participants=d.participants||[];
    timer=Object.assign({running:false,startMs:0,accumMs:0,durationMs:0},d.timer||{});
    ready=true;render();renderClock();
  }
  const es=new EventSource("/api/events");
  es.onmessage=ev=>{try{apply(JSON.parse(ev.data));}catch(e){}};
  es.onerror=()=>{statusEl.textContent="Reconectando…";};
  es.onopen=()=>{statusEl.textContent="";};
})();
</script>
</body>
</html>
